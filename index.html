<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff8ef">
  <title>A little love, just for you 💗</title>
  <style>
    /* Scope the experience so it also renders cleanly inside Streamlit. */
    #love-note, #love-note * { box-sizing: border-box; }
    #love-note {
      --ink: #542b38; --rose: #be385c; --paper: #fff8ef;
      position: fixed; inset: 0; z-index: 100;
      overflow: auto; overflow-x: hidden; isolation: isolate;
      color: var(--ink); background: var(--paper);
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    #love-note .paper-grain {
      position: fixed; inset: 0; pointer-events: none; z-index: -1;
      background-image: radial-gradient(#c77a6917 .7px, transparent .7px);
      background-size: 5px 5px;
    }
    #love-note .wash {
      position: absolute; top: 14%; left: 50%; width: min(760px, 100vw);
      height: 560px; transform: translateX(-50%); pointer-events: none;
      background: radial-gradient(ellipse, #ffded25e, transparent 68%); z-index: -1;
    }
    #love-note .edge {
      position: fixed; top: 0; bottom: 0; width: 12px; pointer-events: none;
      background: repeating-linear-gradient(0deg, #efb4b7 0 12px, #fff0e7 12px 24px);
    }
    #love-note .edge.left { left: 0; }
    #love-note .edge.right { right: 0; }
    #love-note .page {
      min-height: 100%; min-height: 100dvh; width: 100%;
      display: flex; flex-direction: column; align-items: center;
      padding: max(28px, env(safe-area-inset-top)) 34px max(24px, env(safe-area-inset-bottom));
    }
    #love-note .masthead {
      width: min(1040px, 100%); display: flex; align-items: center;
      justify-content: space-between; gap: 16px; font-size: 11px;
      letter-spacing: 2px; text-transform: uppercase;
    }
    #love-note .brand { display: flex; align-items: center; gap: 9px; font-weight: 700; }
    #love-note .brand-heart { font-size: 24px; line-height: 1; color: var(--rose); }
    #love-note .edition { color: #916d72; letter-spacing: 1.6px; }
    #love-note .main {
      width: 100%; max-width: 760px; position: relative; text-align: center;
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 38px 0 32px;
    }
    #love-note .hello {
      color: #a15f6a; font-size: 12px; letter-spacing: 3px;
      text-transform: uppercase; margin: 0 0 26px;
    }
    #love-note .illustration {
      width: 160px; height: 136px; margin-bottom: 24px;
      position: relative; transform: rotate(-7deg);
      animation: love-bob 5s ease-in-out infinite;
    }
    #love-note .envelope {
      position: absolute; bottom: 6px; left: 5px; width: 150px; height: 95px;
      border: 1.5px solid #d5968a; border-radius: 5px;
      background: #f6d2bb; box-shadow: 3px 7px 0 #9c4e5420;
    }
    #love-note .letter {
      width: 117px; height: 90px; left: 22px; top: 11px;
      background: #fffdf4; border: 1px solid #ebd2c5;
      position: absolute; border-radius: 4px; transform: rotate(4deg);
      display: grid; place-items: start center; padding-top: 4px;
    }
    #love-note .letter span { font-size: 48px; color: var(--rose); line-height: 1.2; }
    #love-note .envelope-front {
      position: absolute; inset: 40px 5px 6px;
      clip-path: polygon(0 0,50% 51%,100% 0,100% 100%,0 100%);
      background: linear-gradient(31deg, #f4c5b1 49.5%, #fbd9c1 50%);
      border-radius: 0 0 5px 5px;
    }
    #love-note .seal {
      position: absolute; left: 67px; top: 83px; font-size: 24px;
      color: var(--rose); text-shadow: 0 1px #fff6;
    }
    #love-note .spark { position: absolute; color: #c98e55; font-size: 27px; }
    #love-note .spark.one { top: 3px; right: -26px; transform: rotate(13deg); }
    #love-note .spark.two { left: -24px; top: 53px; font-size: 17px; }
    #love-note h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(52px, 7.6vw, 88px); line-height: 1.02;
      font-weight: 400; letter-spacing: -4px; margin: 0;
      color: var(--ink);
    }
    #love-note h1 em { color: var(--rose); font-weight: 400; }
    #love-note .subtitle { font-size: 14px; line-height: 1.7; color: #966d73; margin: 22px 0 25px; }
    #love-note .tap-button {
      appearance: none; border: 1px solid #ab2c50; background: var(--rose);
      color: #fff9f2; padding: 16px 26px; min-height: 50px;
      border-radius: 100px; font: 700 13px "Trebuchet MS", "Segoe UI", sans-serif;
      box-shadow: 0 4px 0 #9e2647; cursor: pointer; letter-spacing: .2px;
      transition: transform .2s, box-shadow .2s;
    }
    #love-note .tap-button:hover { transform: translateY(-2px); box-shadow: 0 6px 0 #9e2647; }
    #love-note .tap-button:active { transform: translateY(3px); box-shadow: 0 1px 0 #9e2647; }
    #love-note .tap-button:focus-visible { outline: 3px solid #8d4b78; outline-offset: 6px; }
    #love-note .button-heart { display: inline-block; margin-left: 14px; font-size: 19px; vertical-align: -1px; }
    #love-note .kiss-note {
      margin: 30px 0 0; padding: 12px 21px; border-radius: 4px;
      background: #fce9df; border: 1px dashed #e6b9b0;
      color: #9b5666; font-size: 13px; transform: rotate(-2deg);
    }
    #love-note .doodle { position: absolute; pointer-events: none; color: #cf7185; font-family: Georgia, serif; }
    #love-note .doodle.a { top: 27%; left: 1%; font-size: 54px; transform: rotate(-17deg); }
    #love-note .doodle.b { top: 43%; right: 0; font-size: 33px; transform: rotate(16deg); }
    #love-note .doodle.c { bottom: 17%; left: 9%; font-size: 30px; color: #d19b57; }
    #love-note .doodle.d { top: 12%; right: 15%; font-size: 13px; }
    #love-note .footer {
      text-align: center; width: min(1040px, 100%); border-top: 1px solid #eadbd0;
      padding-top: 19px; font-size: 11px; letter-spacing: .6px; color: #a48785;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    #love-note .footer-heart { color: var(--rose); }
    #love-note .effects { position: fixed; inset: 0; pointer-events: none; z-index: 10; overflow: hidden; }
    #love-note .love-popup {
      position: absolute; width: min(282px, calc(100vw - 24px)); padding: 13px 16px 15px;
      color: #7e2945; background: #fffdf5f7; border: 1px solid #e6adb6;
      border-radius: 18px 18px 18px 4px; text-align: center;
      box-shadow: 0 9px 30px #8e2d4820;
      animation: love-popup-in 4s ease forwards;
    }
    #love-note .love-popup strong { display: block; font: italic 29px Georgia, serif; margin-bottom: 5px; }
    #love-note .love-popup small { font: 12px "Trebuchet MS", sans-serif; }
    #love-note .particle { position: absolute; font-size: 21px; animation: love-fly 1.3s ease-out forwards; }
    #love-note .ripple { position: absolute; width: 22px; height: 22px; margin: -11px; border: 1px solid #c85d7d; border-radius: 50%; animation: love-ring .7s ease-out forwards; }
    #love-note .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    @keyframes love-bob { 0%,100% { transform: translateY(0) rotate(-7deg); } 50% { transform: translateY(-7px) rotate(-3deg); } }
    @keyframes love-popup-in { 0% { opacity: 0; transform: translateY(12px) scale(.8); } 12%,73% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-26px) scale(.97); } }
    @keyframes love-fly { 0% { opacity: 0; transform: translate(-50%,-50%) scale(.4); } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--turn)) scale(.7); } }
    @keyframes love-ring { to { transform: scale(6); opacity: 0; } }
    @media (min-width: 1000px) and (min-height: 850px) { #love-note .illustration { margin-bottom: 36px; } }
    @media (max-width: 600px) {
      #love-note .page { padding: 24px 26px 20px; }
      #love-note .edge { width: 7px; }
      #love-note .masthead { font-size: 9px; letter-spacing: 1.5px; }
      #love-note .edition { font-size: 8px; letter-spacing: 1px; }
      #love-note .main { padding: 35px 0 30px; }
      #love-note .hello { margin-bottom: 20px; font-size: 10px; }
      #love-note h1 { font-size: clamp(47px, 12.5vw, 67px); letter-spacing: -2.7px; }
      #love-note .subtitle { font-size: 12px; max-width: 240px; margin: 20px 0 24px; }
      #love-note .illustration { transform: scale(.9) rotate(-7deg); margin-bottom: 16px; }
      #love-note .kiss-note { font-size: 11px; padding: 12px 14px; }
      #love-note .doodle.a { left: -8px; font-size: 31px; top: 25%; }
      #love-note .doodle.b { right: 0; top: 38%; font-size: 22px; }
      #love-note .doodle.c { left: 1%; bottom: 18%; font-size: 20px; }
      #love-note .footer { font-size: 9px; letter-spacing: .2px; }
    }
    @media (max-height: 720px) {
      #love-note .main { padding-top: 22px; padding-bottom: 25px; }
      #love-note .hello { margin-bottom: 8px; }
      #love-note .illustration { height: 120px; margin-bottom: 13px; }
      #love-note h1 { font-size: clamp(43px, 7vw, 68px); }
      #love-note .subtitle { margin: 16px 0 18px; }
      #love-note .kiss-note { margin-top: 23px; }
    }
    @media (prefers-reduced-motion: reduce) {
      #love-note .illustration { animation: none; }
      #love-note .tap-button { transition: none; }
      #love-note .love-popup { animation: none; }
    }
  </style>
</head>
<body>
  <div id="love-note">
    <div class="paper-grain" aria-hidden="true"></div>
    <div class="wash" aria-hidden="true"></div>
    <div class="edge left" aria-hidden="true"></div>
    <div class="edge right" aria-hidden="true"></div>
    <div class="page">
      <header class="masthead">
        <div class="brand"><span class="brand-heart" aria-hidden="true">♡</span> a little love note</div>
        <span class="edition">for my favourite person</span>
      </header>
      <main class="main">
        <span class="doodle a" aria-hidden="true">♡</span>
        <span class="doodle b" aria-hidden="true">♡</span>
        <span class="doodle c" aria-hidden="true">✧</span>
        <span class="doodle d" aria-hidden="true">♥</span>
        <p class="hello">Hey, babu. This one's for you.</p>
        <div class="illustration" aria-hidden="true">
          <div class="envelope"></div>
          <div class="letter"><span>♥</span></div>
          <div class="envelope-front"></div>
          <span class="seal">♥</span>
          <span class="spark one">✧</span><span class="spark two">✦</span>
        </div>
        <h1>a little <em>love,</em><br>just for you.</h1>
        <p class="subtitle">Every little touch, a little more love.<br>Go on, tap anywhere.</p>
        <button class="tap-button" type="button">Tap anywhere, babu <span class="button-heart" aria-hidden="true">♡</span></button>
        <p class="kiss-note">ek kissi day do na babu 😘💋</p>
      </main>
      <footer class="footer"><span>made with a very full heart <span class="footer-heart">♥</span></span><span>always you. only you.</span></footer>
    </div>
    <div class="effects" aria-hidden="true"></div>
    <div class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  </div>
  <script>
    (() => {
      const root = document.getElementById('love-note');
      if (!root || root.dataset.ready) return;
      root.dataset.ready = 'true';
      const effects = root.querySelector('.effects');
      const status = root.querySelector('[role="status"]');
      const button = root.querySelector('.tap-button');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      const hearts = ['♥', '💗', '♡', '💋', '💕', '✦'];
      let announcementTimer;

      function removeLater(element, milliseconds) {
        window.setTimeout(() => element.remove(), milliseconds);
      }

      function showLove(x, y) {
        // Bound the live effect count even during rapid tapping.
        while (effects.childElementCount > 72) effects.firstElementChild.remove();
        const box = root.getBoundingClientRect();
        const localX = x - box.left;
        const localY = y - box.top;
        const popup = document.createElement('div');
        popup.className = 'love-popup';
        const title = document.createElement('strong');
        title.textContent = 'I love you 💗';
        const message = document.createElement('small');
        message.textContent = 'ek kissi day do na babu 😘💋';
        popup.append(title, message);
        effects.append(popup);
        const width = popup.offsetWidth;
        const height = popup.offsetHeight;
        const left = Math.max(12, Math.min(localX - width / 2, box.width - width - 12));
        const top = localY > height + 35 ? localY - height - 20 : localY + 22;
        popup.style.left = `${left}px`;
        popup.style.top = `${Math.max(12, Math.min(top, box.height - height - 12))}px`;
        removeLater(popup, 4000);

        if (!reducedMotion.matches) {
          const ring = document.createElement('span');
          ring.className = 'ripple';
          ring.style.left = `${localX}px`;
          ring.style.top = `${localY}px`;
          effects.append(ring);
          removeLater(ring, 750);
          for (let i = 0; i < 9; i++) {
            const particle = document.createElement('span');
            particle.className = 'particle';
            particle.textContent = hearts[i % hearts.length];
            const angle = (Math.PI * 2 * i / 9) + Math.random() * .4;
            const distance = 65 + Math.random() * 70;
            particle.style.cssText = `left:${localX}px;top:${localY}px;color:#be385c;--dx:${Math.cos(angle) * distance}px;--dy:${Math.sin(angle) * distance - 35}px;--turn:${Math.random() * 80 - 40}deg`;
            effects.append(particle);
            removeLater(particle, 1350);
          }
        }
        clearTimeout(announcementTimer);
        status.textContent = '';
        announcementTimer = setTimeout(() => {
          status.textContent = 'I love you. ek kissi day do na babu 😘💋';
        }, 80);
      }

      root.addEventListener('pointerdown', event => {
        if (event.button !== 0 && event.pointerType === 'mouse') return;
        showLove(event.clientX, event.clientY);
      });
      // Keyboard and assistive technology activation fires a click without a pointer.
      button.addEventListener('click', event => {
        if (event.detail !== 0) return;
        const rect = button.getBoundingClientRect();
        showLove(rect.left + rect.width / 2, rect.top + rect.height / 2);
      });
    })();
  </script>
</body>
</html>
